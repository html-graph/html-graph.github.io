<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>HTMLGraph | Orthogonal edges demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <style>
      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
      }

      body {
        position: relative;
        font-family: Arial, sans-serif;
      }

      #canvas {
        position: absolute;
        inset: 0;
      }

      .node {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        width: 100px;
        height: 100px;
        background: #daedbd;
        border: 1px solid #9e9e9e;
        box-shadow: 0 0 5px #9e9e9e;
        border-radius: 50%;
        user-select: none;
      }

      .node-ports-container {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .node-port {
        position: absolute;
        width: 0;
      }

      .node-port-top {
        left: 50%;
        top: 0;
      }

      .node-port-bottom {
        left: 50%;
        bottom: 0;
      }

      .node-port-left {
        left: 0;
        top: 50%;
      }

      .node-port-right {
        right: 0;
        top: 50%;
      }

      .node-port::after {
        content: "";
        position: absolute;
        top: -3px;
        left: -3px;
        width: 6px;
        height: 6px;
        background: #777777;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="canvas"></div>
    <script type="module">
      import { CanvasBuilder } from "https://html-graph.github.io/lib/v9.0.0/html-graph.min.js";

      class Application {
        constructor(element) {
          this.canvas = new CanvasBuilder(element)
            .setDefaults({
              edges: {
                shape: {
                  type: "orthogonal",
                  hasTargetArrow: true,
                },
              },
              ports: {
                direction: Math.PI / 2,
              },
            })
            .enableUserDraggableNodes()
            .enableUserTransformableViewport()
            .enableBackground()
            .build();
        }

        initGraph() {
          this.canvas
            .addNode(
              this.createNode({
                x: 200,
                y: 50,
                nodeId: "node-1",
              }),
            )
            .addNode(
              this.createNode({
                x: 600,
                y: 250,
                nodeId: "node-2",
              }),
            )
            .addNode(
              this.createNode({
                x: 200,
                y: 250,
                nodeId: "node-3",
              }),
            )
            .addNode(
              this.createNode({
                x: 450,
                y: -25,
                nodeId: "node-4",
              }),
            )
            .addNode(
              this.createNode({
                x: 450,
                y: 375,
                nodeId: "node-5",
              }),
            )
            .addEdge({ from: "node-1-right", to: "node-2-top" })
            .addEdge({ from: "node-2-left", to: "node-3-top" })
            .addEdge({ from: "node-4-right", to: "node-4-top" })
            .addEdge({ from: "node-5-right", to: "node-5-right" })
            .focus();
        }

        createNode({ nodeId, x, y }) {
          const node = document.createElement("div");
          const portsContainer = document.createElement("div");
          const topPort = document.createElement("div");
          const bottomPort = document.createElement("div");
          const leftPort = document.createElement("div");
          const rightPort = document.createElement("div");

          node.classList.add("node");
          portsContainer.classList.add("node-ports-container");
          topPort.classList.add("node-port");
          bottomPort.classList.add("node-port");
          leftPort.classList.add("node-port");
          rightPort.classList.add("node-port");

          topPort.classList.add("node-port-top");
          bottomPort.classList.add("node-port-bottom");
          leftPort.classList.add("node-port-left");
          rightPort.classList.add("node-port-right");

          portsContainer.appendChild(topPort);
          portsContainer.appendChild(bottomPort);
          portsContainer.appendChild(leftPort);
          portsContainer.appendChild(rightPort);
          node.appendChild(portsContainer);

          return {
            element: node,
            x: x,
            y: y,
            ports: [
              { id: `${nodeId}-top`, element: topPort, direction: Math.PI / 2 },
              { id: `${nodeId}-bottom`, element: bottomPort, direction: Math.PI / 2},
              { id: `${nodeId}-left`, element: leftPort, direction: Math.PI },
              { id: `${nodeId}-right`, element: rightPort, direction: 0 },
            ],
          };
        }
      }

      const element = document.getElementById("canvas");
      const app = new Application(element);

      app.initGraph();
    </script>
  </body>
</html>
